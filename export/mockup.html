<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Instagram mockup export — Blokraai Woordeboek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=7">
  <link rel="stylesheet" href="../css/export-mockup.css?v=2">
</head>
<body class="export-page">
  <div class="export-intro">
    <h1>Instagram mockup export</h1>
    <p>
      Gebruik die knoppies hieronder om PNG-lêers te laai vir Instagram.
      Die lêers word ook in <code>website/assets/social/</code> gehou vir hergebruik.
    </p>
    <div class="export-actions">
      <button type="button" id="download-square">Laai vierkant (1080×1080)</button>
      <button type="button" id="download-story">Laai storief (1080×1920)</button>
    </div>
  </div>

  <div class="export-grid">
    <div class="export-card">
      <h2>Vierkantige voorskou</h2>
      <div class="export-preview-wrap export-preview-wrap--square">
        <div id="artboard-square-preview" class="artboard artboard--square artboard--preview" aria-hidden="true"></div>
      </div>
    </div>
    <div class="export-card">
      <h2>Storief-voorskou</h2>
      <div class="export-preview-wrap export-preview-wrap--story">
        <div id="artboard-story-preview" class="artboard artboard--story artboard--preview" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="export-capture-host" aria-hidden="true">
    <div id="artboard-square" class="artboard artboard--square"></div>
    <div id="artboard-story" class="artboard artboard--story"></div>
  </div>

  <template id="phone-mockup-template">
    <div class="phone-mockup">
      <div class="phone-glow"></div>
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="phone-status-bar">
          <span>9:41</span>
          <span class="phone-status-icons">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h20v2H2zM4 13h16v2H4zM7 9h10v2H7z"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          </span>
        </div>

        <div class="phone-app-header">
          <p class="phone-title-main">Blokkiesraaisel-</p>
          <p class="phone-title-sub">woordeboek</p>
        </div>

        <div class="phone-features">
          <div class="phone-feature clue" style="--i: 0">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <img src="../assets/leidraad/leidraad-overview.png" alt="" width="26" height="26" decoding="async">
            </span>
            <span class="phone-feature-label">Leidraad</span>
          </div>

          <div class="phone-feature answer" style="--i: 1">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <img src="../assets/antwoord/antwoord-overview.png" alt="" width="26" height="26" decoding="async">
            </span>
            <span class="phone-feature-label">Antwoord</span>
          </div>

          <div class="phone-feature groups" style="--i: 2">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <img src="../assets/groepe/groups-overview.png" alt="" width="26" height="26" decoding="async">
            </span>
            <span class="phone-feature-label">Groepe</span>
          </div>

          <div class="phone-feature lengths" style="--i: 3">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <img src="../assets/lengtes/lengths-logo.png" alt="" width="26" height="26" decoding="async">
            </span>
            <span class="phone-feature-label">Lengtes</span>
          </div>

          <div class="phone-feature anagram" style="--i: 4">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <img src="../assets/anagram/anagram-overview.png" alt="" width="26" height="26" decoding="async">
            </span>
            <span class="phone-feature-label">Anagram</span>
          </div>

          <div class="phone-feature panagram" style="--i: 5">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <img src="../assets/pangram/pangram-overview.png" alt="" width="26" height="26" decoding="async">
            </span>
            <span class="phone-feature-label">Pangram</span>
          </div>

          <div class="phone-feature twist featured" style="--i: 6">
            <div class="phone-feature-shine"></div>
            <span class="phone-feature-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </span>
            <div class="phone-feature-body">
              <span class="phone-feature-label">Draai en Pas</span>
              <span class="phone-feature-desc">Draai die ringe — los die leidraad op</span>
            </div>
            <span class="phone-feature-arrow">→</span>
          </div>
        </div>

        <div class="phone-carousel-dots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const template = document.getElementById("phone-mockup-template");

    function mountMockup(targetId) {
      const target = document.getElementById(targetId);
      target.appendChild(template.content.cloneNode(true));
    }

    mountMockup("artboard-square");
    mountMockup("artboard-story");
    mountMockup("artboard-square-preview");
    mountMockup("artboard-story-preview");

    async function waitForImages(root) {
      const images = Array.from(root.querySelectorAll("img"));
      await Promise.all(images.map((img) => {
        if (img.complete) return Promise.resolve();
        return new Promise((resolve) => {
          img.addEventListener("load", resolve, { once: true });
          img.addEventListener("error", resolve, { once: true });
        });
      }));
      await document.fonts.ready;
    }

    async function downloadArtboard(elementId, filename, buttonId) {
      const button = document.getElementById(buttonId);
      const artboard = document.getElementById(elementId);
      button.disabled = true;

      try {
        await waitForImages(artboard);
        const canvas = await html2canvas(artboard, {
          backgroundColor: null,
          scale: 1,
          useCORS: true,
          logging: false,
        });

        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("download-square").addEventListener("click", () =>
      downloadArtboard("artboard-square", "instagram-mockup-square.png", "download-square")
    );

    document.getElementById("download-story").addEventListener("click", () =>
      downloadArtboard("artboard-story", "instagram-mockup-story.png", "download-story")
    );
  </script>
</body>
</html>
